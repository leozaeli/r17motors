<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#090909"><meta name="robots" content="noindex,nofollow"><title>Painel | R17 Motors</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="balboa.css"><link rel="stylesheet" href="admin.css"><script src="supabase-config.js"></script><script type="module" src="admin.js"></script></head><body class="admin-body"><main class="admin-shell"><a class="admin-logo" href="/"><img src="logo/r17motors-transparent.png" alt="R17 Motors"></a><section class="admin-auth" id="auth-view"><p class="admin-eyebrow">Área restrita</p><h1>Seu acervo,<br><em>sob controle.</em></h1><p class="admin-copy">Entre com o acesso administrativo para cadastrar e publicar veículos.</p><form id="login-form" class="admin-form"><label>E-mail<input name="email" type="email" required placeholder="voce@r17motors.com.br"></label><label>Senha<input name="password" type="password" required placeholder="Sua senha"></label><button type="submit">Entrar <span>→</span></button><p class="admin-feedback" id="auth-feedback"></p></form></section><section class="admin-app" id="app-view" hidden><header class="admin-topbar"><div><p class="admin-eyebrow">Painel R17</p><h1>Veículos</h1></div><button class="admin-signout" id="signout" type="button">Sair</button></header><div class="admin-layout"><section class="admin-card"><div class="admin-card-heading"><p class="admin-eyebrow">Novo cadastro</p><h2>Adicionar veículo</h2></div><form id="vehicle-form" class="vehicle-form"><div class="form-grid"><label>Marca<input name="brand" required placeholder="Ex.: BMW"></label><label>Modelo<input name="model" required placeholder="Ex.: 330i"></label><label>Versão<input name="version" placeholder="Ex.: M Sport"></label><label>Ano<input name="year" type="number" min="1900" max="2100" placeholder="2024"></label><label>Quilometragem<input name="mileage" type="number" min="0" placeholder="15000"></label><label>Preço (R$)<input name="price" type="number" min="0" step="0.01" placeholder="350000"></label><label>Cor<input name="color" placeholder="Preto Safira"></label><label>Câmbio<input name="transmission" placeholder="Automático"></label><label>Combustível<input name="fuel" placeholder="Flex"></label><label>Status<select name="status"><option value="draft">Rascunho</option><option value="published">Publicado</option><option value="sold">Vendido</option></select></label></div><label>Descrição<textarea name="description" rows="4" placeholder="Destaques, procedência e configuração."></textarea></label><label class="file-input">Fotos do veículo<input name="images" type="file" accept="image/*" multiple><span>Selecione uma ou mais imagens</span></label><label class="checkbox"><input type="checkbox" name="featured"> Destacar este veículo</label><button class="admin-save" type="submit">Salvar veículo <span>→</span></button><p class="admin-feedback" id="vehicle-feedback"></p></form></section><section class="admin-card admin-list"><div class="admin-card-heading"><p class="admin-eyebrow">Acervo</p><h2>Publicados e rascunhos</h2></div><div id="vehicles-list" class="vehicles-list"><p class="admin-muted">Carregando acervo…</p></div></section></div></section></main></body></html>
